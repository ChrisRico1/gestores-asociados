name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint changed analytics modules
        run: npx eslint src/lib/analytics.ts src/routes/privacidad.tsx --rule=prettier/prettier:off
      - name: Tests
        run: npm test -- --passWithNoTests
      - name: Production build
        run: npm run build
